name: Update Composer Dependencies

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * 1" # Every Monday at 03:00 UTC

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, fileinfo
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Update all Composer packages
        run: composer update --with-all-dependencies --prefer-dist --no-progress

      - name: Show updated packages
        run: composer outdated

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add composer.json composer.lock

          if git diff --cached --quiet; then
            echo "No dependency updates found."
            exit 0
          fi

          git commit -m "chore: update Composer dependencies"
          git push
